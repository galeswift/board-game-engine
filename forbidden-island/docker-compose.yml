services:
  forbidden-island:
    build:
      # Relative to this file's directory (forbidden-island/), so ".."
      # is the repo root - required so the Dockerfile can COPY files
      # from packages/rules-engine-core, which lives outside this
      # folder. Equivalent to running, from the repo root:
      #   docker build -f forbidden-island/Dockerfile -t forbidden-island .
      context: ..
      dockerfile: forbidden-island/Dockerfile
    ports:
      - "3000:3000"
