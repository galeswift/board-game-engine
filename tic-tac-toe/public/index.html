<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe — Board Game Engine</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <p id="status">Loading…</p>
    <div id="board" class="board"></div>
    <div class="controls">
      <button id="newLocalGameBtn">New Local Game</button>
      <button id="newMultiplayerGameBtn">New Multiplayer Game</button>
      <button id="shareBtn">Copy Share Link</button>
    </div>
    <p class="hint">Local: pass-and-play on one device. Multiplayer: share
      the link so a second player can join from any device.</p>
  </main>
  <script src="/client.js"></script>
</body>
</html>
